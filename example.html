<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cafe 3D Menu (Live Server)</title>
  <style>
    html, body { margin:0; height:100%; overflow:hidden; background:#0b0f14; }
    canvas { display:block; }
    .hud{
      position:fixed; left:16px; top:16px; z-index:10;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      color:#e5e7eb; background:rgba(15,23,42,.55);
      border:1px solid rgba(148,163,184,.18);
      padding:12px 14px; border-radius:14px; backdrop-filter:blur(10px);
      max-width:360px;
    }
    .hud b{ color:#fff; }
    .hud small{ color:#cbd5e1; display:block; margin-top:6px; line-height:1.35; }
  </style>

  <!-- ✅ THIS is the key: map bare "three" imports to a real URL -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="hud">
    <b>KIIT Café 3D Menu</b>
    <small>Drag items • Scroll zoom • Orbit camera</small>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { DragControls } from "three/addons/controls/DragControls.js";

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x0b0f14, 9, 34);

    const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 200);
    camera.position.set(4.2, 2.6, 7.2);

    const renderer = new THREE.WebGLRenderer({ antialias:true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const orbit = new OrbitControls(camera, renderer.domElement);
    orbit.enableDamping = true;
    orbit.minDistance = 3;
    orbit.maxDistance = 14;
    orbit.maxPolarAngle = Math.PI * 0.48;

    scene.add(new THREE.AmbientLight(0xffffff, 0.45));

    const key = new THREE.DirectionalLight(0xffffff, 1.15);
    key.position.set(6, 8, 4);
    key.castShadow = true;
    key.shadow.mapSize.set(1024,1024);
    scene.add(key);

    const rim = new THREE.DirectionalLight(0x88aaff, 0.35);
    rim.position.set(-6, 3, -4);
    scene.add(rim);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(60, 60),
      new THREE.MeshStandardMaterial({ color:0x0f172a, roughness:1 })
    );
    floor.rotation.x = -Math.PI/2;
    floor.position.y = -0.95;
    floor.receiveShadow = true;
    scene.add(floor);

    // --- helpers (textures + rounded box) ---
    function makeLabelTexture({ bg="#e11d48", fg="#ffffff", title="LABEL", sub="text" }){
      const c = document.createElement("canvas");
      c.width = 512; c.height = 512;
      const ctx = c.getContext("2d");
      ctx.fillStyle = bg; ctx.fillRect(0,0,c.width,c.height);
      ctx.globalAlpha = 0.12; ctx.fillStyle="#000";
      for(let y=0;y<c.height;y+=28) ctx.fillRect(0,y,c.width,12);
      ctx.globalAlpha = 1;
      ctx.fillStyle = fg;
      ctx.font = "900 96px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(title, c.width/2, c.height/2 - 20);
      ctx.font = "700 34px Arial";
      ctx.fillText(sub, c.width/2, c.height/2 + 52);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      return tex;
    }

    function roundedRectShape(w,h,r){
      const s = new THREE.Shape();
      const x=-w/2, y=-h/2;
      s.moveTo(x+r,y); s.lineTo(x+w-r,y);
      s.quadraticCurveTo(x+w,y,x+w,y+r);
      s.lineTo(x+w,y+h-r);
      s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
      s.lineTo(x+r,y+h);
      s.quadraticCurveTo(x,y+h,x,y+h-r);
      s.lineTo(x,y+r);
      s.quadraticCurveTo(x,y,x+r,y);
      return s;
    }

    function makeRoundedBox(w,h,d,r){
      const shape = roundedRectShape(w,h,r);
      const geo = new THREE.ExtrudeGeometry(shape,{
        depth:d,
        bevelEnabled:true,
        bevelThickness: Math.min(r, d*0.22),
        bevelSize:r,
        bevelSegments:6,
        curveSegments:12,
        steps:1
      });
      geo.center();
      return geo;
    }

    function applyCrinkle(geo, amount=0.008){
      const pos = geo.attributes.position;
      for(let i=0;i<pos.count;i++){
        const vx=pos.getX(i), vy=pos.getY(i), vz=pos.getZ(i);
        const n=(Math.sin(vx*8+vy*6)+Math.cos(vy*7+vz*10))*amount;
        pos.setXYZ(i, vx+n, vy+n, vz+n);
      }
      pos.needsUpdate = true;
      geo.computeVertexNormals();
    }

    // --- models ---
    function createLaysPacket(){
      const geo = makeRoundedBox(1.45, 2.05, 0.36, 0.12);
      applyCrinkle(geo);

      const tex = makeLabelTexture({ bg:"#facc15", fg:"#111827", title:"LAYS", sub:"Classic Chips" });
      const front = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map:tex, roughness:0.55, metalness:0.05 }));
      const back  = new THREE.Mesh(geo.clone(), new THREE.MeshStandardMaterial({ color:0xf59e0b, roughness:0.75 }));
      back.scale.set(0.992,0.992,0.992);
      back.position.z -= 0.003;

      const g = new THREE.Group();
      g.add(back, front);
      g.traverse(o => { if(o.isMesh) o.castShadow = true; });
      return g;
    }

    function createSandwich(){
      const g = new THREE.Group();
      const breadGeo = makeRoundedBox(1.6, 1.18, 0.18, 0.18);
      const breadMat = new THREE.MeshStandardMaterial({ color:0xf5d0a6, roughness:0.95 });

      const bottom = new THREE.Mesh(breadGeo, breadMat); bottom.position.y = 0.05;
      const top    = new THREE.Mesh(breadGeo.clone(), breadMat); top.position.y = 0.30;

      const fillGeo = makeRoundedBox(1.35, 0.96, 0.085, 0.10);
      const patty   = new THREE.Mesh(fillGeo, new THREE.MeshStandardMaterial({ color:0x7c2d12, roughness:0.96 }));
      patty.position.y = 0.12; patty.scale.set(1.0,0.9,1.0);
      const lettuce = new THREE.Mesh(fillGeo.clone(), new THREE.MeshStandardMaterial({ color:0x22c55e, roughness:0.9 }));
      lettuce.position.y = 0.165;
      const cheese  = new THREE.Mesh(fillGeo.clone(), new THREE.MeshStandardMaterial({ color:0xfbbf24, roughness:0.85 }));
      cheese.position.y = 0.215;

      g.add(bottom, patty, lettuce, cheese, top);
      g.rotation.y = 0.35;
      g.traverse(o => { if(o.isMesh) o.castShadow = true; });
      return g;
    }

const loader = new THREE.TextureLoader();

    function createCokeCan() {
        const g = new THREE.Group();

        const bodyGeo = new THREE.CylinderGeometry(0.42, 0.42, 1.35, 48, 1, true);

        const labelTex = loader.load("./assets/images.jpg");
        labelTex.colorSpace = THREE.SRGBColorSpace;
        labelTex.wrapS = THREE.RepeatWrapping;   // wrap around
        labelTex.wrapT = THREE.ClampToEdgeWrapping;
        labelTex.repeat.set(1, 1);              // keep 1 unless your image needs tiling
        labelTex.anisotropy = 8;

        const bodyMat = new THREE.MeshStandardMaterial({
            map: labelTex,
            metalness: 0.6,   // can is metallic, label is not—this is a “good enough” look
            roughness: 0.35
        });

    const body = new THREE.Mesh(bodyGeo, bodyMat);

    // top/bottom same as before
    const capMat = new THREE.MeshStandardMaterial({ color: 0xd1d5db, metalness: 0.92, roughness: 0.2 });

    const top = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.40, 0.08, 48), capMat);
    top.position.y = 0.715;

    const bottom = top.clone();
    bottom.position.y = -0.715;

    const rim = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.03, 16, 64), capMat);
    rim.rotation.x = Math.PI / 2;
    rim.position.y = 0.73;

    g.add(body, top, bottom, rim);
    g.traverse(o => { if (o.isMesh) o.castShadow = true; });
    return g;
}

    // --- add items (float + rotate + draggable) ---
    const items = [];
    function addItem(obj, pos, name, price){
      obj.position.copy(pos);
      obj.userData = {
        name, price,
        baseY: pos.y,
        phase: Math.random()*Math.PI*2,
        dir: Math.random()>0.5 ? 1 : -1
      };
      scene.add(obj);
      items.push(obj);
    }

    addItem(createLaysPacket(), new THREE.Vector3(-1.9, 0.0, 0.0), "Lays", "₹20");
    addItem(createSandwich(),   new THREE.Vector3(0.0, -0.25, 0.2), "Sandwich", "₹60");
    addItem(createCokeCan(),    new THREE.Vector3(1.9, -0.05, 0.0), "Coke", "₹40");

    const drag = new DragControls(items, camera, renderer.domElement);
    drag.addEventListener("dragstart", () => orbit.enabled = false);
    drag.addEventListener("dragend", () => orbit.enabled = true);
    drag.addEventListener("drag", (e) => {
      const o = e.object;
      o.position.y = o.userData.baseY; // lock to table height
    });

    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const t = clock.getElapsedTime();
      for (const g of items){
        g.position.y = g.userData.baseY + Math.sin(t*1.3 + g.userData.phase)*0.09;
        g.rotation.y += 0.0055 * g.userData.dir;
      }
      orbit.update();
      renderer.render(scene, camera);
    });

    addEventListener("resize", () => {
      camera.aspect = innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
